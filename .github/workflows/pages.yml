name: Pages preview

# Publishes the site on every push to main: https://owlbear.dicelore.quest/ once the custom domain is
# set in Settings > Pages, https://magus-inc.github.io/strahd-log/ before that. configure-pages reports
# the address and path in use, so the build's links are right either way.
# Needs the repository to be public (free plan) and Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: python build.py
        env:
          URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Page-view counts at https://owlbear.goatcounter.com (no cookies); remove to stop counting.
          GOATCOUNTER: owlbear
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
