name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tools/site_diff.py builds main from history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # The same commands as `just test` and `just build`; just is not installed on the runner.
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python build.py
      # What this pull request changes on the built site (pictures by name, text word for word).
      # A refactor should show "No changes"; run `just site-diff --fail-on-change` for that.
      - name: Compare the site with main
        if: github.event_name == 'pull_request'
        run: |
          echo '### Site changes against main' >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          python tools/site_diff.py --base "origin/${{ github.base_ref }}" --max-lines 300 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
