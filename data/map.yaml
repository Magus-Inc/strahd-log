# Places on our own map of Barovia (drawn by barovia_map.py; not traced from any published map).
# Coordinates are in the map's 1000 x 750 drawing space, x to the east, y to the south, placed
# from where the official map of Barovia puts them, as checked against the adventure logs. Each place
# sits on a road vertex in barovia_map.ROADS, so the trail can follow the roads to it.
#
# places:   wiki page slug -> {xy: [x, y], label: text shown on the map (default: page title),
#           names: only these names of the page count as a visit (default: all of them),
#           anchor: label above (middle, the default), below, to the right (start) or left (end),
#           offroad: true for a place with no road to it; the trail reaches it with a dotted line)
# within:   wiki page slug of a room or building -> the mapped place it is in. A mention of the
#           Blue Water Inn is a stop in Vallaki.

places:
  barovia:
    xy: [780, 450]
    label: Village of Barovia
    # "Barovia" alone usually means the whole land, so only the village's own names count.
    names: [Village of Barovia, Barovia Village, Village Barovia]
  # Durst Manor stands outside the village, east of the gates: the party walked for hours from it
  # and came to the gates before they reached the village.
  durst-manor: {xy: [968, 345], anchor: end}
  gates-of-barovia: {xy: [930, 398], label: Gates, anchor: end}
  # Chris: a different place from the gates above, on the road toward Castle Ravenloft.
  west-gates-of-barovia: {xy: [600, 334], label: West Gates, anchor: end}
  # The Vistani camp is on the west shore of the pool, as on the official map (Chris, 2026-11-03).
  tser-pool: {xy: [668, 486], label_at: [642, 516]}
  castle-ravenloft: {xy: [720, 398]}
  tser-crossroads: {xy: [610, 360], label: Tser Pool Crossroads, anchor: end}
  the-windmill: {xy: [473, 314], label: Old Bonegrinder, anchor: below}
  # Vallaki sits just off the Old Svalich Road, up a short lane toward the lake.
  vallaki: {xy: [400, 250]}
  # The Vistani camp by Vallaki: south of town, toward the Luna River ("A doll for Arabelle": Yann's
  # head lay "toward the Luna River"; Chris remembers the camp south of Vallaki).
  vallaki-vistani-camp: {xy: [378, 300], label: Vistani Camp, label_at: [431, 305]}
  # Two crossroads: the Luna River crossroads (P) just west of Vallaki, a four-way crossroads (Act 3:
  # roads east to Vallaki and on to Raven River, trails to Lake Baratok and Berez), and the
  # Raven River crossroads (R) further west, where the Krezk, Tsolenka and Lake Baratok roads meet.
  luna-river-crossroads: {xy: [350, 278], anchor: below}
  raven-river-crossroads: {xy: [220, 262], anchor: below}
  # The name sits on the water; the pin stays where the trail forks by the lake.
  lake-baratok: {xy: [258, 214], label_at: [227, 176]}
  tower-of-khazan: {xy: [250, 202]}
  # The werewolf den: a cave in the hills on the west side of Lake Baratok (Z on the official map).
  lake-baratok-cave: {xy: [192, 172], label: Werewolf Den, anchor: end}
  krezk: {xy: [120, 232], anchor: end}
  abbey-of-saint-markovia: {xy: [133, 208], label: Abbey of St. Markovia}
  wizard-of-wines: {xy: [110, 360], anchor: start}
  yester-hill: {xy: [70, 488], anchor: start}
  # The Whispering Wall lies just southwest of Yester Hill, off the roads.
  whispering-wall: {xy: [40, 520], offroad: true, anchor: start}
  # Chris, 2026-11-02: west and a little south, clear of the Berez trail (the trail runs between it and the Luna).
  argynvostholt: {xy: [316, 384], anchor: end}
  berez: {xy: [330, 450], label: Ruins of Berez, anchor: end}
  tsolenka-pass: {xy: [240, 578], anchor: start}
  amber-temple: {xy: [380, 640]}

# spots:    points on the roads that are not places (no wiki page, pin, label or card), named so a
#           session's trail can pass through one and its number can sit where the main action was
#           (data/trail.yaml `marker`). Each sits on a road vertex, unless offroad: true.
spots:
  the-old-oak: {xy: [712, 486], label: the old oak by the River Ivlis}
  tser-pool-road: {xy: [649, 567], label: the loop road south of the Tser Pool camp}
  tser-falls-bridge: {xy: [600, 405], label: Tser Falls bridge}
  lake-road: {xy: [499, 252], label: the lake road east of Vallaki}
  bonegrinder-road: {xy: [530, 286], label: the road to Old Bonegrinder, near: the-windmill}
  bonegrinder-fork: {xy: [487, 319], label: the turnoff to Old Bonegrinder, near: the-windmill}
  yester-hill-trail: {xy: [130, 400], label: the trail to Yester Hill}
  vallaki-east-road: {xy: [442, 259], label: the road an hour east of Vallaki}

within:
  # Father Donavich's church (Rest for the Wicked).
  barovia-village-church: barovia
  durst-mill: barovia
  # The tavern in the village where the party met Ismark (Barovia, Barovia).
  blood-on-the-vine-tavern: barovia
  blue-water-inn: vallaki
  wachterhaus: vallaki
  blinsky-s-toy-store: vallaki
  baron-s-mansion: vallaki
  church-of-saint-andral: vallaki
  refugee-camp: vallaki
  hill-of-ravenloft: castle-ravenloft
  kings-bedchamber: castle-ravenloft
  torture-chamber: castle-ravenloft
  strahds-tomb: castle-ravenloft
  hall-of-bones: castle-ravenloft
  catacombs-of-ravenloft: castle-ravenloft
  brazier-room: castle-ravenloft
  larders-of-ill-omen: castle-ravenloft
  serpents-wing: castle-ravenloft
  rooms-of-weeping: castle-ravenloft
  drowning-cells: castle-ravenloft
  hall-of-niches: abbey-of-saint-markovia
  false-meadow: abbey-of-saint-markovia
  # Vallaki's gates: refugees at the Eastern Gate, Izek out through the Zarovich Gate (The Fall of Izek).
  eastern-gate: vallaki
  zarovich-gate: vallaki
  # The cursed altar in the werewolf den (Blood and Oaths Under Moonlight).
  shrine-of-mother-night: lake-baratok-cave

# landmarks: wiki pages for things drawn on the map that are not places to stop (rivers, woods, mountains,
#            a lone tree): wiki page slug -> {xy, anchor, label}. Only the page's own map shows one, opening
#            on it with a red dot and its name; the map page has no pin, label or card for it. Each sits
#            where the party first met it. Forest Fane, Kavan's Cairn and Zoldoph wait until the party goes there.
landmarks:
  # The "K & V" oak with Katarina's letter, on the Old Windmill Road east of Vallaki on the way to the
  # gates (The Oath, the Spy and the Silver Moon). Not the oak by the Ivlis (the-old-oak spot).
  ancient-oak: {xy: [530, 286], anchor: start}
  # On the river where it runs south past Vallaki toward Berez.
  luna-river: {xy: [366, 350], anchor: start}
  # The woods the party first walked, around Durst Manor and the Village of Barovia.
  svalich-woods: {xy: [880, 280], anchor: end}
  # The sun sank behind the Balinoks as the party left Vallaki (Unwelcome Guests): the western peaks.
  balinoks: {xy: [250, 470]}

# Hand-drawn pictures laid on the map (static/images/map/sprites/<image>.webp, cut by tools/make_sprites.py).
# name: {image: file stem, xy: [x, y] centre of the picture, width: in map units; the height
# follows the picture's shape, place: the place it shows and links to (default: the name; null for
# none)}. Move them with `just map-edit` (drag, or scroll to resize).
sprites:
  castle-ravenloft: {image: castle-ravenloft, xy: [722.5, 385.4], width: 85.1}
  barovia: {image: barovia, xy: [783.4, 437.9], width: 57.3}
  vallaki: {image: vallaki, xy: [400, 246], width: 70}
  krezk: {image: krezk, xy: [112, 228], width: 54}
  abbey-of-saint-markovia: {image: abbey-of-saint-markovia, xy: [144.5, 197.8], width: 39.1}
  the-windmill: {image: the-windmill, xy: [473, 304], width: 44}
  tower-of-khazan: {image: tower-of-khazan, xy: [258, 189.2], width: 30}
  werewolf-den: {image: werewolf-den, xy: [190, 164], width: 36, place: lake-baratok-cave}
  argynvostholt: {image: argynvostholt, xy: [314, 375], width: 50}
  wizard-of-wines: {image: wizard-of-wines, xy: [104.2, 352], width: 44.3}
  yester-hill: {image: yester-hill, xy: [71.2, 480], width: 46.4}
  durst-manor: {image: durst-manor, xy: [972.7, 332.8], width: 22.6}
  tser-pool: {image: tser-pool, xy: [659, 487], width: 38}
  # The camp by Vallaki reuses the Tser Pool camp's ring of wagons, a little smaller.
  vallaki-vistani-camp: {image: tser-pool, xy: [378, 303], width: 36}
  gates-west: {image: gates, xy: [599.6, 340], width: 35.3, place: west-gates-of-barovia}
  gates-east: {image: gates, xy: [932.6, 388], width: 35.3, place: gates-of-barovia}
  berez: {image: berez, xy: [325.7, 444], width: 35.5}
  amber-temple: {image: amber-temple, xy: [384.8, 630], width: 38.4}
  whispering-wall: {image: whispering-wall, xy: [43.3, 514], width: 35.5}
  # A signpost at each crossroads with a wiki page.
  signpost-luna-river: {image: signpost, xy: [342, 262], width: 24, place: luna-river-crossroads}
  signpost-raven-river: {image: signpost, xy: [228, 246], width: 24, place: raven-river-crossroads}
  signpost-tser-pool: {image: signpost, xy: [624, 346], width: 24, place: tser-crossroads}
  # A bridge wherever a road crosses water (see test_roads_cross_water_only_where_the_official_map_does).
  bridge-luna-crossroads: {image: bridge, xy: [355.8, 276.5], width: 22.9, place: null}
  bridge-raven-river: {image: bridge, xy: [182.8, 251.8], width: 22.9, place: null}
  bridge-tser-falls: {image: bridge, xy: [600, 405], width: 22.9, place: null}
  bridge-ivlis: {image: bridge, xy: [758.8, 524.6], width: 22.9, place: null}
  bridge-luna-lake: {image: bridge, xy: [245, 581.7], width: 22.9, place: null}
