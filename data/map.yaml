# Places on our own map of Barovia (drawn by barovia_map.py; not traced from any published map).
# Coordinates are in the map's 1000 x 750 drawing space, x to the east, y to the south, placed
# from where the adventure logs and the table map put things relative to each other. Each place
# sits on a road vertex in barovia_map.ROADS, so the trail can follow the roads to it.
#
# places:   wiki page slug -> {xy: [x, y], label: text shown on the map (default: page title),
#           names: only these names of the page count as a visit (default: all of them),
#           anchor: label above (middle, the default), to the right (start) or left (end)}
# within:   wiki page slug of a room or building -> the mapped place it is in. A mention of the
#           Blue Water Inn is a stop in Vallaki.

places:
  barovia:
    xy: [795, 440]
    label: Village of Barovia
    # "Barovia" alone usually means the whole land, so only the village's own names count.
    names: [Village of Barovia, Barovia Village, Village Barovia]
  # Durst Manor stands outside the village, east of the gates: the party walked for hours from it
  # and came to the gates before they reached the village.
  durst-manor: {xy: [974, 366], anchor: end}
  gates-of-barovia: {xy: [935, 392], label: Gates, anchor: end}
  tser-pool: {xy: [652, 445], anchor: end}
  castle-ravenloft: {xy: [707, 357]}
  the-windmill: {xy: [492, 316], label: Old Bonegrinder}
  vallaki: {xy: [388, 243]}
  raven-river-crossroads: {xy: [226, 266], label: Crossroads, anchor: start}
  lake-baratok: {xy: [204, 205], anchor: start}
  tower-of-kazan: {xy: [226, 182], anchor: start}
  krezk: {xy: [102, 232], anchor: end}
  abbey-of-saint-markovia: {xy: [122, 206], label: Abbey of St. Markovia}
  wizard-of-wines: {xy: [92, 350]}
  yester-hill: {xy: [52, 412], anchor: start}
  argynvostholt: {xy: [325, 365]}
  berez: {xy: [305, 440], label: Ruins of Berez}
  tsolenka-pass: {xy: [230, 520]}
  amber-temple: {xy: [352, 612]}

within:
  durst-mill: barovia
  blue-water-inn: vallaki
  wachter-haus: vallaki
  blinsky-s-toy-store: vallaki
  baron-s-mansion: vallaki
  church-of-saint-andral: vallaki
  blood-on-the-vine-tavern: vallaki
  refugee-camp: vallaki
  hill-of-ravenloft: castle-ravenloft
  kings-bedchamber: castle-ravenloft
  torture-chamber: castle-ravenloft
  strahds-tomb: castle-ravenloft
  hall-of-bones: castle-ravenloft
  catacombs-of-ravenloft: castle-ravenloft
  brazier-room: castle-ravenloft
  larders-of-ill-omen: castle-ravenloft
  serpents-wing: castle-ravenloft
  rooms-of-weeping: castle-ravenloft
  drowning-cells: castle-ravenloft
  hall-of-niches: abbey-of-saint-markovia
  false-meadow: abbey-of-saint-markovia
  lake-baratok-cave: lake-baratok
