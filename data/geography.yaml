# The geography of our own map of Barovia (drawn by barovia_map.py; nothing is traced). Coordinates are
# in the map's 1000 x 750 drawing space, x to the east, y to the south. `just map-edit` edits this file.
#
# roads, tracks, unused_tracks: name -> points along the way. A point two ways share is a junction, and
#           every place sits on a point, so the ways are also the graph the party's trail is routed over.
#           A way may instead be {points: [...], shapes: {i: shape}}, where the stretch from point i to
#           point i+1 is drawn as {bends: n, width: w} (switchbacks) or {wiggle: r} (small seeded kinks).
# lakes:    name -> shore points, a closed outline.   rivers: name -> points, downstream last.
# forests:  outlines the trees fill.   mountains: {at, radius, count, size}.   labels: {text, at, size, angle}.

# Roads, as polylines. A vertex shared by two roads is a junction, and every place on the map
# sits on a vertex, so the roads double as the graph the trail is routed over. Tracks are drawn
# dotted but are routed over like roads. Where the roads run and where they meet follows the
# official map of Barovia; the hours in data/travel-times.yaml only set the scale bar.
