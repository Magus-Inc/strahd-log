summaries:
  Gates of Barovia: The gates between Durst Manor and the village of Barovia, which the party passed on the way in.
  West Gates of Barovia: Fog-wreathed gates flanked by headless statues on the road toward Castle Ravenloft.
  Bianca: Franz's sister, who cares for him.
  Bianca (werewolf): A werewolf with ties to Kiril, torn between love and survival.
  Gray Stones: Gemstones Strahd gave the party at the Whispering Wall; crushed, they cast Locate Object.
  Vasilka: The flesh-built "perfect bride" the Abbot made for Strahd.
  Vladimir Horngaard: Slain commander of the Order of the Silver Dragon, now a vengeful presence at Argynvostholt.
  Dmitri Krezkov: The baron of Krezk, husband of Anna.

