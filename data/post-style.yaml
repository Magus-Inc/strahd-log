# One look for every session post (poststyle.py). Picked by Chris on the post style page, 2026-11-01.
# Each setting's values are listed in poststyle.OPTIONS; the first value of each leaves posts as written.
cast: pills          # PCs present as pills under the title; the Characters list is not repeated
headings: real       # bold first lines become headings; no colon after "Summary"
entries: bullets     # Key Locations, Encounters, Loot, NPCs...: one bullet per entry, name in bold
links: gold          # hand-made wiki links look like the automatic gold ones
bold: plain          # no bold names mid-sentence in the story (recap lists keep theirs)
glance: none         # no At a Glance box; the story starts after the pills
tagline: keep        # keep the line under the title where written
picture: scene       # the feature picture stays beside the scene it shows
story: titled       # one heading over the story, named below (not "Summary"; picked 2026-11-02)
story-title: Malron’s Account
scenes: written      # scene headings at natural breaks, short, in Malron's voice (data/scene-headings.yaml)
# The layout review: Chris's picks, 2026-11-02 (layout pick page, https://claude.ai/artifact/6wQjcCy7ruP52QdWCkqq3Z).
slides: above-story  # the slides right under the pills, above Malron's Account
opening: in-story    # lines written above the Characters list are the story's first lines
extra-titles: hide   # no second title above the story (it repeated the tagline)
quotes: letters      # letters read as letters, not as headings
recap-prose: bullets # every entry in Key Locations, Encounters... is a bullet
sections: template   # "What we learned" is called Plot Points like everywhere else
recap-pictures: story  # a picture never sits in the recap lists
relink: each-heading # first mention of a wiki name links in every section of On this page
