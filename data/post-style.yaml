# The look of every session post (poststyle.py). Picked by Chris on the post style page, 2026-11-01,
# the layout review and the tagline look page (2026-11-02). Each setting's values are listed in
# poststyle.OPTIONS. The posts themselves follow one format (AGENTS.md, "One post format").
cast: pills          # PCs present as pills under the title, from each post's `cast:`
glance: none         # no At a Glance box; the story starts after the pills
tagline: keep        # keep the line under the title where written
tagline-look: subtitle    # the tagline in the title's serif, italic and larger, so it reads as a subtitle (picked 2026-11-02)
card-tagline: instead     # chronicle cards and the latest session show the tagline, no summary (Chris, 2026-11-02)
picture: scene       # the feature picture stays beside the scene it shows
story: titled        # one heading over the story, named below (picked 2026-11-02)
story-title: Malron’s Account
scenes: written      # the post's scene headings, short, in Malron's voice
slides: above-story  # the slides right under the pills, above Malron's Account
relink: each-heading # first mention of a wiki name links in every section of On this page
