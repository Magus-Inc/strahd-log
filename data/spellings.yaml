# Names spelled as the Curse of Strahd book spells them. dnd-scribe keeps a copy in
# campaign/spellings.yaml (its tests compare them). `just spellings` fixes the posts, wiki
# pages and log extracts; tests/test_spellings.py fails while a wrong spelling is left.
#
# The book fixes SPELLINGS only. What happened at the table comes from the posts and Chris, and
# names Ryan made up (Malron's table, the Belview children, Arturi, Eliza, Kreza...) stay as written.
# Matching is whole words and case-sensitive. A right spelling must never also be a wrong one.
#
# Checked 2026-10-31 against the book's character index (Ravenloft wiki "Curse of Strahd" page).
# Marked "(asked)" are the ones Chris was asked about on the review page.

