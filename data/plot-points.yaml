# Where Malron's Account tells each Plot Points entry (Chris, 2026-11-03: every plot point should
# already be in the story above it). One list per post, in the order of its Plot Points: `point` is
# the entry's opening words, `told` one or more phrases copied from the account (any case, straight
# or curly quotes). tests/test_plot_points.py checks every post against this file. A plot point the
# story does not tell is added to the story from the transcript, Chris's notes or Ryan's texts,
# never invented.

