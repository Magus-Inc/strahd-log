{% extends "base.html" %}
{% set section = "search" %}
{% block title %}Search | {{ site_title }}{% endblock %}
{% block content %}
    <header class="page-head">
      <p class="eyebrow">Search</p>
      <h1>Find anything</h1>
      <p class="lede">Every session and wiki page.</p>
    </header>
    <form class="search-form" action="{{ base }}search/" method="get" role="search">
      <input id="q" name="q" type="search" placeholder="Strahd, Ireena, the amber temple..." autocomplete="off" aria-label="Search the chronicle and wiki">
    </form>
    <p id="search-status" class="muted">Type to search every session and wiki page.</p>
    <ol id="results" class="results"></ol>
    <noscript><p class="muted">Search needs JavaScript. Browse the <a href="{{ base }}">chronicle</a> or the <a href="{{ base }}wiki/">wiki</a> instead.</p></noscript>
{% endblock %}
{% block scripts %}
  <script>
    // SearchMatch and SearchResults come from the header's search panel (templates/_search_panel.html).
    (function () {
      var base = {{ base | tojson }};
      var input = document.getElementById("q");
      var list = document.getElementById("results");
      var status = document.getElementById("search-status");
      var entries = null;

      function run() {
        var q = input.value.trim();
        if (!q) { list.innerHTML = ""; status.textContent = "Type to search every session and wiki page."; return; }
        SearchResults.show(SearchMatch.search(entries, q), list, status, base);
      }
      fetch(base + "search-index.json").then(function (r) { return r.json(); }).then(function (data) {
        entries = data;
        var q = new URLSearchParams(location.search).get("q");
        if (q) input.value = q;
        input.addEventListener("input", function () {
          history.replaceState(null, "", input.value ? "?q=" + encodeURIComponent(input.value) : location.pathname);
          run();
        });
        run();
        input.focus();
      }).catch(function () { status.textContent = "Search could not load its index."; });
    })();
  </script>
{% endblock %}
