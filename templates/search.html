{% extends "base.html" %}
{% set section = "search" %}
{% block title %}Search | {{ site_title }}{% endblock %}
{% block content %}
    <header class="page-head">
      <p class="eyebrow">Search</p>
      <h1>Find anything</h1>
      <p class="lede">Every session and wiki page.</p>
    </header>
    <form class="search-form" action="{{ base }}search/" method="get" role="search">
      <input id="q" name="q" type="search" placeholder="Strahd, Ireena, the amber temple..." autocomplete="off" aria-label="Search the chronicle and wiki">
    </form>
    <p id="search-status" class="muted">Type to search every session and wiki page.</p>
    <ol id="results" class="results"></ol>
    <noscript><p class="muted">Search needs JavaScript. Browse the <a href="{{ base }}">chronicle</a> or the <a href="{{ base }}wiki/">wiki</a> instead.</p></noscript>
    <script>
    (function () {
      var base = {{ base | tojson }};
      var input = document.getElementById("q");
      var list = document.getElementById("results");
      var status = document.getElementById("search-status");
      var entries = null;

      function fold(s) {
        return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      }
      function esc(s) {
        return s.replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; });
      }
      function snippet(text, folded, term) {
        var at = folded.indexOf(term);
        if (at < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? "…" : "");
        var start = Math.max(0, at - 70), end = Math.min(text.length, at + term.length + 90);
        return (start ? "…" : "") + esc(text.slice(start, at)) + "<mark>" + esc(text.slice(at, at + term.length)) +
          "</mark>" + esc(text.slice(at + term.length, end)) + (end < text.length ? "…" : "");
      }
      // Same icons as templates/_badges.html.
      var SLIDES_ICON = '<svg class="badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg>';
      var PICTURE_ICON = '<svg class="badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
      var SKULL_ICON = '<svg class="badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.2 4.4 3 5.5V20h10v-3.5c1.8-1.1 3-2.9 3-5.5a8 8 0 0 0-8-8z"/><circle cx="9" cy="11.5" r="1.6"/><circle cx="15" cy="11.5" r="1.6"/><path d="M10.5 20v-2.5M13.5 20v-2.5"/></svg>';
      var PARTY_ICON = '<svg class="badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.5 2.1 4.5 5.4"/></svg>';
      // Skull for a death (d: names, spoken label) and party tag for a joining, return or leaving (c).
      function lifeTags(e) {
        return (e.d ? ' <span class="death-tag" role="img" aria-label="' + esc(e.d.a) + '" title="' + esc(e.d.a) + '">' + SKULL_ICON +
                  '<span aria-hidden="true">' + esc(e.d.n) + "</span></span>" : "") +
          (e.c ? ' <span class="party-tag">' + PARTY_ICON + esc(e.c) + "</span>" : "");
      }
      function run() {
        var q = fold(input.value.trim());
        list.innerHTML = "";
        if (!q) { status.textContent = "Type to search every session and wiki page."; return; }
        var terms = q.split(/\s+/);
        var hits = [];
        entries.forEach(function (e) {
          var title = fold(e.t), body = e.f || (e.f = fold(e.x));
          var score = 0;
          for (var i = 0; i < terms.length; i++) {
            var inTitle = title.indexOf(terms[i]) >= 0, inBody = body.indexOf(terms[i]) >= 0;
            if (!inTitle && !inBody) return;
            score += (inTitle ? 10 : 0) + (inBody ? 1 + Math.min(body.split(terms[i]).length - 1, 9) : 0);
          }
          hits.push({e: e, score: score});
        });
        hits.sort(function (a, b) { return b.score - a.score; });
        status.textContent = hits.length ? hits.length + (hits.length === 1 ? " match" : " matches") : "No matches.";
        hits.slice(0, 50).forEach(function (h) {
          var li = document.createElement("li");
          li.className = "card result" + (h.e.p ? " has-pic" : "");
          var text = '<span class="chip">' + esc(h.e.l) + '</span><h2><a class="stretched" href="' + base + h.e.u + '">' + esc(h.e.t) +
            '</a></h2><p class="teaser">' + snippet(h.e.x, h.e.f, terms[0]) + "</p>" +
            (h.e.s || h.e.d || h.e.c ? '<p class="meta">' + (h.e.s ? '<span class="slides-tag">' + SLIDES_ICON + h.e.s + (h.e.s === 1 ? " slide" : " slides") + "</span>" : "") +
              lifeTags(h.e) + "</p>" : "");
          li.innerHTML = h.e.p ? '<div class="wiki-card-text">' + text + '</div><span class="pic-badge"><span class="pic-thumb"><img src="' + base + h.e.p +
            '" alt="" loading="lazy" decoding="async"></span>' +
            (h.e.n > 1 ? '<span class="pic-count" role="img" aria-label="' + h.e.n + ' pictures">' + PICTURE_ICON + h.e.n + "</span>" : "") + "</span>" : text;
          list.appendChild(li);
        });
      }
      fetch(base + "search-index.json").then(function (r) { return r.json(); }).then(function (data) {
        entries = data;
        var q = new URLSearchParams(location.search).get("q");
        if (q) input.value = q;
        input.addEventListener("input", function () {
          history.replaceState(null, "", input.value ? "?q=" + encodeURIComponent(input.value) : location.pathname);
          run();
        });
        run();
        input.focus();
      }).catch(function () { status.textContent = "Search could not load its index."; });
    })();
    </script>
{% endblock %}
