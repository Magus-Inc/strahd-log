{% extends "base.html" %}
{% block content %}
    <ol class="post-list">
{% for post in posts %}
      <li>
        <a class="post-link" href="{{ base }}{{ post.path }}">{{ post.title }}</a>
        <time datetime="{{ post.date.isoformat() }}">{{ post.date | nice_date }}</time>
{% if post.tagline %}
        <p class="tagline">{{ post.tagline }}</p>
{% endif %}
      </li>
{% endfor %}
    </ol>
{% endblock %}
