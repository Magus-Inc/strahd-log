  <dialog class="search-panel" aria-label="Search the chronicle and wiki">
    <form class="search-panel-bar" action="{{ base }}search/" method="get" role="search">
      <svg class="search-panel-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="site-search-q" name="q" type="search" enterkeyhint="search" placeholder="Strahd, Ireena, the amber temple..." autocomplete="off" aria-label="Search the chronicle and wiki">
      <button class="search-panel-close" type="button" aria-label="Close search">Close</button>
    </form>
    <p class="search-panel-status muted" role="status">Type to search every session and wiki page.</p>
    <ol class="results search-panel-results"></ol>
  </dialog>
  <script data-search-panel>
    // Search from any page (Chris, 2026-11-04: "so many extra clicks and page loads"). The magnifier in the
    // header (and Search in the menu) opens this panel over the page: the keyboard comes up at once and
    // results show as you type, without loading the search page. The index is fetched only the first time
    // the panel opens. The last search is remembered for this tab, so Back from a result and one tap
    // brings it back. "/" opens it from the keyboard. Without the script the links go to the search page.
{% filter indent(4) %}
{% include "_search_match.js" %}
{% include "_search_results.js" %}
{% endfilter %}
    (function () {
      var base = {{ base | tojson }};
      var box = document.querySelector("dialog.search-panel");
      if (!box || !box.showModal) return;
      var input = box.querySelector("input"), list = box.querySelector("ol"), status = box.querySelector("[role=status]");
      var EMPTY = status.textContent, KEY = "search:q";
      var entries = null, loading = null;
      function load() {
        if (!loading) {
          loading = fetch(base + "search-index.json").then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          }).then(function (data) { entries = data; });
          loading.catch(function () {
            loading = null;  // try again next time
            status.innerHTML = 'Search could not load. Try the <a href="' + base + 'search/">search page</a>.';
          });
        }
        return loading;
      }
      function run() {
        var q = input.value.trim();
        try { sessionStorage.setItem(KEY, input.value); } catch (e) {}
        if (!q) { list.innerHTML = ""; status.textContent = EMPTY; return; }
        if (!entries) { status.textContent = "Loading search…"; return; }
        SearchResults.show(SearchMatch.search(entries, q), list, status, base);
      }
      function open() {
        var page = document.getElementById("q");  // already on the search page: use its own box
        if (page) { page.focus(); page.select(); return; }
        var menu = document.getElementById("menu-toggle");
        if (menu) menu.checked = false;
        if (!box.open) {
          var saved = "";
          try { saved = sessionStorage.getItem(KEY) || ""; } catch (e) {}
          if (saved && !input.value) input.value = saved;
          box.showModal();
          document.documentElement.classList.add("search-open");
        }
        input.focus();  // in the same tap, so phones bring up the keyboard
        input.select();
        run();
        load().then(run, function () {});
      }
      document.querySelectorAll("[data-search-open]").forEach(function (a) {
        a.addEventListener("click", function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;  // a new tab still gets the search page
          e.preventDefault(); open();
        });
        a.addEventListener("pointerdown", function () { load(); }, { once: true });  // a head start on the index
      });
      input.addEventListener("input", run);
      box.querySelector("form").addEventListener("submit", function (e) { e.preventDefault(); input.blur(); });  // Enter or Search hides the keyboard
      box.querySelector(".search-panel-close").addEventListener("click", function () { box.close(); });
      box.addEventListener("click", function (e) { if (e.target === box) box.close(); });  // a tap outside the panel
      box.addEventListener("close", function () { document.documentElement.classList.remove("search-open"); });
      document.addEventListener("keydown", function (e) {
        var t = e.target, typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
        if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey && !document.querySelector("dialog[open]")) {
          e.preventDefault(); open();
        }
      });
    })();
  </script>
